name: Clippy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Run Clippy
        run: cargo clippy
          --all-targets
          --all-features
          --locked
