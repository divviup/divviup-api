version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 20
    groups:
      opentelemetry:
        patterns:
          - '*opentelemetry*'
      trillium:
        patterns:
          - "trillium"
          - "trillium-*"
      janus:
        patterns:
          - "janus_*"
  - package-ecosystem: "npm"
    directory: "app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 20
    ignore:
      # TODO(#1534): Temporarily ignore react-router updates until we have had a
      # chance to do a controlled migration, and test the results.
      - dependency-name: react-router
      - dependency-name: react-router-dom
    groups:
      eslint:
        patterns:
          - "*eslint*"
      react:
        patterns:
          - 'react'
          - '@types/react'
          - 'react-dom'
          - '@types/react-dom'
      react-router:
        patterns:
          - 'react-router'
          - 'react-router-dom'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "main"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "main"
